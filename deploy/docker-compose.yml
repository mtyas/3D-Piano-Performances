# docker compose -f deploy/docker-compose.yml up -d --build
# Before the first start: create ../.performer-password (16+ characters, e.g. run setup/setup-server.sh)
# and set PUBLIC_ORIGIN, e.g. in deploy/.env:  PUBLIC_ORIGIN=https://stage.example.com
services:
  piano-stage:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8765}:8765"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the exact browser origin, e.g. https://stage.example.com}
      PERFORMER_NAME: ${PERFORMER_NAME:-Pianist}
      PERFORMER_PASSWORD_FILE: /run/secrets/performer_password
    secrets:
      - performer_password
    volumes:
      - piano-archives:/data/archives

secrets:
  performer_password:
    file: ../.performer-password

volumes:
  piano-archives:
