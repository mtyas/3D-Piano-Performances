<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Private concert archive manager</title><style>
[hidden]{display:none!important}:root{color-scheme:dark;font:16px system-ui;background:#10141a;color:#e9e4dc}body{max-width:1000px;margin:40px auto;padding:0 20px}h1{font-size:30px}p{color:#b9bdc5}button,input,a{font:inherit}button,.link{background:#252e3b;color:#fff;border:1px solid #49566a;border-radius:7px;padding:9px 12px;cursor:pointer}button:disabled{opacity:.4}input{padding:10px;background:#1d2530;color:white;border:1px solid #566174;border-radius:6px}form,.toolbar,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}article{display:grid;grid-template-columns:1fr auto;gap:15px;border-top:1px solid #384353;padding:20px 0}h2{font-size:18px;margin:0 0 8px}small{color:#aeb7c5}.hidden{color:#e5b773}.danger{color:#ffaaa0}#status{min-height:24px;white-space:pre-wrap}a{color:#e5bb79}.actions{justify-content:flex-end}@media(max-width:650px){article{grid-template-columns:1fr}.actions{justify-content:flex-start}}</style>
<h1>Private concert archives</h1><p>Manage recordings with your performer login. Imports start hidden. Delete moves a recording to private server trash.</p>
<form id="login"><label>Performer password <input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form>
<div id="manager" hidden><div class="toolbar"><label class="link">Import recording <input id="import" type="file" accept=".json,application/json" hidden></label><button id="refresh">Refresh</button><button id="logout">Sign out</button><a href="./">Concert hall</a></div><p>Use ↑ and ↓ to set the public display order. Export includes MIDI, poses, and recorded audio.</p><div id="recordings"></div></div><p id="status" role="status"></p><script type="module" src="./archive-admin.js"></script></html>
